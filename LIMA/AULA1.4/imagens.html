<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagens.css">
    <title>Revisão - Imagens e Vídeos</title>
</head>
<body>
    <h1>Trabalhando com Imagens</h1>

    <h2 class="seletor">Imagens responsiva básica</h2>
    <figure class="resp-bas">
        <img src="img/ariel.jpg" alt="imagem 1" width="350px" height="500px">
    </figure>

    <h2>Imagem com Recorte</h2>
    <figure class="img-rec">
        <img src="img/eric.jpg" alt="imagem 2">
    </figure>

    <h2>Imagem em formato de cards</h2>
    <figure class="img-card">
        <img src="img/ursula.jpg" alt="Imagem 3">
    </figure>

    <h2>Personalização</h2>
    <figure class="pers-img">
        <img src="img/ariel2.gif" alt="imagem 4">
    </figure>

    <h2>Imagens em Grid</h2>
    <section class="sec-grid">
        <article class="img-grid">
        <img src="img/aufilipe.jpg" alt="imagem5">
    </article>

    <article class="img-grid">
        <img src="img/filipi.jpg" alt="imagem6">
    </article>

    <article class="img-grid">
        <img src="img/sleeping_beauty.webp" alt="imagem7">
    </article>
    </section>

    <section class="video">
        <h2>Trailer do Filme</h2>
        <p>Era Uma Vez No Sonho | com letra | A Bela Adormecida</p>
    </section>
    
    <iframe class="video-bd" width="560" height="315" src="https://www.youtube.com/embed/BmnbYutrgzQ?si=MsdyQBxWjOIucf9k&amp;start=70" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
</body>
</html>
